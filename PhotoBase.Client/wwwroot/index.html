<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhotoBase</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="PhotoBase.Client.styles.css" rel="stylesheet" />
    <!-- USWDS v3.13.0 compiled CSS (replaces v2 uswds-custom.css) -->
    <link rel="stylesheet" href="uswds-custom/dist/styles.css" />
    <script src="uswds/js/uswds-init.min.js"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.loadUSWDS = function () {
            // Remove any previous USWDS script to avoid double-loading
            if (window.uswdsScriptLoaded) return;
            var s = document.createElement('script');
            s.src = '/uswds/js/uswds.min.js';
            document.body.appendChild(s);
            window.uswdsScriptLoaded = true;
            console.log("USWDS v3 loaded via Blazor");
        };

        // Trigger a browser file download from a byte array passed by Blazor
        window.downloadFileFromBytes = function (fileName, contentType, bytes) {
            var blob = new Blob([new Uint8Array(bytes)], { type: contentType });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };
    </script>
</body>

</html>
